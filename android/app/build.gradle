plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xfr1688.pp360'
    compileSdk 34

    defaultConfig {
        applicationId "com.xfr1688.pp360"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        encoding = 'UTF-8'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// 纯 framework API，无需任何第三方依赖
dependencies {
}
