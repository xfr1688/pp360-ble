name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Assemble debug APK
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Collect APK
        if: success()
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/pp360-ble.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk out/pp360-ble-v0.6.apk
          ls -lh out/pp360-ble.apk

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pp360-ble-apk
          path: out/pp360-ble.apk

      - name: Publish latest to Release
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          { gh release view latest >/dev/null 2>&1 || gh release create latest --title "拍拍360 安卓版 APK" --notes "GitHub Actions 自动构建，debug 签名，安装时允许未知来源即可。"; } >> publish.log 2>&1
          gh release upload latest out/pp360-ble.apk --clobber >> publish.log 2>&1
          echo "latest upload exit=$?" >> publish.log

      - name: Rebuild historical version APKs
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          touch publish.log rebuild.log
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/pp360-ble-v0.6.apk 2>/dev/null
          for pair in be97515:0.3 0634d06:0.4 aa4e843:0.5; do
            sha="${pair%%:*}"
            ver="${pair##*:}"
            echo "=== rebuild v$ver from $sha ===" >> publish.log
            git checkout -f "$sha" >> rebuild.log 2>&1
            ( cd android && gradle :app:assembleDebug --no-daemon --stacktrace ) >> rebuild.log 2>&1
            if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
              cp android/app/build/outputs/apk/debug/app-debug.apk "out/pp360-ble-v$ver.apk"
              echo "v$ver build ok" >> publish.log
            else
              echo "v$ver build failed" >> publish.log
            fi
          done
          ls -lh out/ >> publish.log 2>&1
          gh release upload latest out/pp360-ble-v0.3.apk out/pp360-ble-v0.4.apk out/pp360-ble-v0.5.apk out/pp360-ble-v0.6.apk --clobber >> publish.log 2>&1
          echo "version upload exit=$?" >> publish.log

      - name: Upload logs
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload latest publish.log --clobber || true
          if [ -f build.log ]; then tail -c 100000 build.log > p360-build.log; gh release upload latest p360-build.log --clobber || true; fi
          if [ -f rebuild.log ]; then tail -c 200000 rebuild.log > p360-rebuild.log; gh release upload latest p360-rebuild.log --clobber || true; fi
