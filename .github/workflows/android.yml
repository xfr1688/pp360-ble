name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Assemble debug APK
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Collect APK
        if: success()
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/pp360-ble.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk out/pp360-ble-v0.6.apk
          ls -lh out/pp360-ble.apk

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pp360-ble-apk
          path: out/pp360-ble.apk

      - name: Publish latest to Release
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          { gh release view latest >/dev/null 2>&1 || gh release create latest --title "拍拍360 安卓版 APK（固定下载入口）" --notes "始终指向最新构建。历史版本见 v0.3 / v0.4 / v0.5 / v0.6。"; } >> publish.log 2>&1
          gh release upload latest out/pp360-ble.apk --clobber >> publish.log 2>&1
          echo "latest upload exit=$?" >> publish.log

      - name: Rebuild historical version APKs
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          touch publish.log rebuild.log
          mkdir -p out
          if gh release view latest --json assets --jq '.assets[].name' 2>/dev/null | grep -q "pp360-ble-v0.5.apk"; then
            echo "version apks already in latest, skip rebuild" >> publish.log
          else
            for pair in be97515:0.3 0634d06:0.4 aa4e843:0.5; do
              sha="${pair%%:*}"
              ver="${pair##*:}"
              echo "=== rebuild v$ver from $sha ===" >> publish.log
              git checkout -f "$sha" >> rebuild.log 2>&1
              rm -rf android/app/build android/.gradle
              ( cd android && gradle clean :app:assembleDebug --no-daemon --stacktrace ) >> rebuild.log 2>&1
              if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
                cp android/app/build/outputs/apk/debug/app-debug.apk "out/pp360-ble-v$ver.apk"
                echo "v$ver build ok" >> publish.log
              else
                echo "v$ver build failed" >> publish.log
              fi
            done
            gh release upload latest out/pp360-ble-v0.3.apk out/pp360-ble-v0.4.apk out/pp360-ble-v0.5.apk out/pp360-ble-v0.6.apk --clobber >> publish.log 2>&1
          fi

      - name: Push version tags and create releases
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p out
          gh release download latest -D out -p "pp360-ble-v*.apk" --clobber >> publish.log 2>&1
          ls -lh out/ >> publish.log 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/xfr1688/pp360-ble.git"
          push_tag() {
            tag="$1"; sha="$2"
            git tag -f "$tag" "$sha" >> publish.log 2>&1
            git push -f origin "refs/tags/$tag" >> publish.log 2>&1
            echo "tag $tag push exit=$?" >> publish.log
          }
          push_tag v0.3 be97515
          push_tag v0.4 0634d06
          push_tag v0.5 aa4e843
          push_tag v0.6 9e3ff94
          publish() {
            tag="$1"; title="$2"; notes="$3"; asset="$4"
            echo "=== release $tag ===" >> publish.log
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag already exists" >> publish.log
              return 0
            fi
            if [ -n "$asset" ] && [ -f "$asset" ]; then
              gh release create "$tag" "$asset" --verify-tag --title "$title" --notes "$notes" >> publish.log 2>&1
            else
              gh release create "$tag" --verify-tag --title "$title" --notes "$notes" >> publish.log 2>&1
            fi
            echo "create exit=$?" >> publish.log
          }
          publish v0.3 "PP360 v0.3 - 相机拍摄" "单拍 / 定时（3s×6、5s×12、10s×18）/ 全景 18 格 / 人脸抓拍四种模式；拍摄页独立 Activity，云台命令走静态桥保持单连接。" "out/pp360-ble-v0.3.apk"
          publish v0.4 "PP360 v0.4 - 自适应图标 + 应用内相册" "自适应桌面图标（Android 8+ 不套白底）；拍摄页真实缩略图；应用内相册（看大图 / 长按删除）。" "out/pp360-ble-v0.4.apk"
          publish v0.5 "PP360 v0.5 - 修复抓拍 / 全景 / 多选" "人脸检测改用 android.media.FaceDetector 软件检测；拍照前 autoFocus + 900ms 兜底；抓拍连续 3 帧命中再停转拍摄；全景 18 张自动拼成一张展开图；相册多选删除 / 多选导出到 Pictures/PP360。" "out/pp360-ble-v0.5.apk"
          publish v0.6 "PP360 v0.6 - 横竖屏自适应" "预览与 JPEG 方向按设备旋转角实时计算；预览按真实比例居中裁满；横屏时上下栏收窄、相册变 5 列；全景横屏切 40%、拼接提升到 960px；抓拍判据放宽并加 60 秒兜底。" "out/pp360-ble-v0.6.apk"
          gh release edit latest --latest >> publish.log 2>&1
          echo "mark latest exit=$?" >> publish.log

      - name: Upload logs
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload latest publish.log --clobber || true
          if [ -f build.log ]; then tail -c 100000 build.log > p360-build.log; gh release upload latest p360-build.log --clobber || true; fi
